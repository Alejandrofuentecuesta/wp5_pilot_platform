<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performer Prompt Tester — BSC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }

    header {
      background: #1e3a5f;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.7; }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }

    .panel { background: white; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
    .panel-header { background: #f0f4f8; padding: 10px 16px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #4a5568; border-bottom: 1px solid #e0e0e0; }

    .config-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.72rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
    input[type="text"], input[type="password"], select, textarea {
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 0.85rem;
      font-family: inherit;
      background: white;
      width: 100%;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1e3a5f; }

    .prompt-section { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .prompt-label { font-size: 0.72rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
    textarea.system { height: 180px; font-size: 0.8rem; line-height: 1.5; resize: vertical; }
    textarea.user { height: 140px; font-size: 0.8rem; line-height: 1.5; resize: vertical; }

    .actions { padding: 12px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #f0f0f0; }
    button.send {
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 9px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.send:hover { background: #2a4d7a; }
    button.send:disabled { background: #8a9ab0; cursor: not-allowed; }
    button.reset {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #555;
    }
    button.reset:hover { background: #f5f5f5; }

    .status { font-size: 0.78rem; color: #888; margin-left: auto; }

    /* Response panel */
    .response-area { padding: 14px 16px; min-height: 180px; }
    .response-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      min-height: 120px;
      color: #1a1a1a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .response-box.empty { color: #aaa; font-style: italic; }
    .response-box.error { color: #c0392b; background: #fef0ef; border-color: #f5c6c0; }
    .response-box.loading { color: #888; }

    .meta { font-size: 0.73rem; color: #888; margin-top: 8px; display: flex; gap: 16px; }

    /* History */
    .history-list { padding: 10px 16px; max-height: 340px; overflow-y: auto; }
    .history-item { border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 10px; overflow: hidden; font-size: 0.8rem; }
    .history-item-header { background: #f0f4f8; padding: 7px 12px; display: flex; justify-content: space-between; color: #555; font-size: 0.72rem; }
    .history-item-body { padding: 10px 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; color: #222; }
    .history-item-body.error { color: #c0392b; }
    .history-empty { color: #aaa; font-style: italic; font-size: 0.82rem; padding: 8px 0; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ccc;
      border-top-color: #1e3a5f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pill {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
      vertical-align: middle;
      margin-left: 6px;
    }
    .pill.ok { background: #d1fae5; color: #065f46; }
    .pill.err { background: #fee2e2; color: #991b1b; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .config-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Performer Prompt Tester</h1>
    <span>BSC Incivility API — modelo Gemma 4 30B</span>
  </div>
</header>

<div class="layout">

  <!-- LEFT: Config + Prompt editor -->
  <div>
    <div class="panel">
      <div class="panel-header">Configuración de API</div>
      <div class="config-row">
        <div class="field">
          <label>BSC Base URL</label>
          <input type="text" id="baseUrl" value="http://212.128.226.126/incivility/api/v1" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="apiKey" value="" placeholder="Pega aquí tu clave" autocomplete="off" />
        </div>
        <div class="field">
          <label>Modelo</label>
          <select id="modelName">
            <option value="incivility" selected>incivility</option>
          </select>
        </div>
      </div>
      <div class="config-row">
        <div class="field">
          <label>Model Version</label>
          <select id="modelVersion">
            <option value="v1" selected>v1 — Gemma 4 30B</option>
            <option value="v2">v2</option>
          </select>
        </div>
        <div class="field">
          <label>Temperature</label>
          <input type="text" id="temperature" placeholder="1.1 (default BSC v1)" value="1.1" />
        </div>
        <div class="field">
          <label>Max tokens</label>
          <input type="text" id="maxTokens" value="256" />
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <div class="panel-header">Prompt del Performer</div>
      <div class="prompt-section">
        <div class="prompt-label">System prompt</div>
        <textarea class="system" id="systemPrompt">You are a 'Performer' in a social-scientific experiment simulating a realistic online chatroom. Read the instructions below, which will guide you to write a short message for your character. Follow the instructions exactly. Output ONLY the message.

## About the Chatroom:
El debate es sobre la nueva ley de inmigración que propone endurecer los controles fronterizos y reducir las cuotas de entrada.

## About You:
Your name in this chatroom is **Carlos**.</textarea>
        <div class="prompt-label" style="margin-top:4px;">User prompt</div>
        <textarea class="user" id="userPrompt">## Your persona:
Eres un ciudadano español de 45 años, trabajador, con opiniones firmes sobre inmigración. Crees que los controles son necesarios para mantener el orden.

## What you Want to Achieve:
You want to: expresar tu apoyo a la ley de forma directa
This matters to you because: crees que la seguridad nacional es prioritaria
Your message must be: directa, informal, convincente

## Action:
Post a general message to the chatroom.</textarea>
      </div>
      <div class="actions">
        <button class="send" id="sendBtn" onclick="sendPrompt()">Enviar →</button>
        <button class="reset" onclick="resetDefaults()">Restablecer</button>
        <span class="status" id="statusText"></span>
      </div>
    </div>
  </div>

  <!-- RIGHT: Response + History -->
  <div>
    <div class="panel">
      <div class="panel-header">Respuesta del modelo</div>
      <div class="response-area">
        <div class="response-box empty" id="responseBox">La respuesta aparecerá aquí...</div>
        <div class="meta" id="responseMeta" style="display:none;">
          <span id="metaTime"></span>
          <span id="metaModel"></span>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-top:12px;">
      <div class="panel-header">Historial de respuestas</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">Ninguna respuesta todavía.</div>
      </div>
    </div>
  </div>

</div>

<script>
  let history = [];
  let callCount = 0;

  const DEFAULTS = {
    systemPrompt: document.getElementById('systemPrompt').value,
    userPrompt: document.getElementById('userPrompt').value,
  };

  function resetDefaults() {
    document.getElementById('systemPrompt').value = DEFAULTS.systemPrompt;
    document.getElementById('userPrompt').value = DEFAULTS.userPrompt;
  }

  async function sendPrompt() {
    const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
    const apiKey = document.getElementById('apiKey').value.trim();
    const modelName = document.getElementById('modelName').value.trim();
    const modelVersion = document.getElementById('modelVersion').value;
    const temperatureRaw = document.getElementById('temperature').value.trim();
    const maxTokensRaw = document.getElementById('maxTokens').value.trim();
    const systemPrompt = document.getElementById('systemPrompt').value;
    const userPrompt = document.getElementById('userPrompt').value;

    if (!baseUrl || !apiKey) {
      showError('Rellena la URL base y la API Key.');
      return;
    }
    if (!userPrompt.trim()) {
      showError('El user prompt no puede estar vacío.');
      return;
    }

    const temperature = temperatureRaw ? parseFloat(temperatureRaw) : null;
    const maxTokens = maxTokensRaw ? parseInt(maxTokensRaw) : 256;

    // Build the merged message (BSC merges system into user)
    let content = userPrompt;
    if (systemPrompt.trim()) {
      content = systemPrompt.trim() + '\n\n---\n\n' + userPrompt;
    }

    const body = {
      model: modelName,
      messages: [{ role: 'user', content }],
      max_tokens: maxTokens,
      extra_body: { model_version: modelVersion },
    };
    if (temperature !== null && !isNaN(temperature)) body.temperature = temperature;

    // UI: loading
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Enviando...';
    document.getElementById('statusText').textContent = '';
    setResponseLoading();

    const t0 = Date.now();
    callCount++;
    const callNum = callCount;

    try {
      const resp = await fetch(`${baseUrl}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`,
        },
        body: JSON.stringify(body),
      });

      const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

      if (!resp.ok) {
        let errText = '';
        try { const j = await resp.json(); errText = JSON.stringify(j, null, 2); } catch { errText = await resp.text(); }
        throw new Error(`HTTP ${resp.status}: ${errText}`);
      }

      const data = await resp.json();
      const text = data?.choices?.[0]?.message?.content
                || data?.choices?.[0]?.message?.reasoning_content
                || '(respuesta vacía)';

      const usedModel = data?.model || modelName;

      setResponseOk(text);
      document.getElementById('metaTime').textContent = `⏱ ${elapsed}s`;
      document.getElementById('metaModel').textContent = `Modelo: ${usedModel} (${modelVersion})`;
      document.getElementById('responseMeta').style.display = 'flex';
      document.getElementById('statusText').innerHTML = `<span class="pill ok">OK</span>`;

      addHistory(callNum, text, false, elapsed, usedModel, modelVersion);
    } catch (err) {
      const elapsed = ((Date.now() - t0) / 1000).toFixed(2);
      setResponseError(err.message);
      document.getElementById('statusText').innerHTML = `<span class="pill err">Error</span>`;
      addHistory(callNum, err.message, true, elapsed, modelName, modelVersion);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar →';
    }
  }

  function setResponseLoading() {
    const box = document.getElementById('responseBox');
    box.className = 'response-box loading';
    box.textContent = 'Esperando respuesta...';
    document.getElementById('responseMeta').style.display = 'none';
  }

  function setResponseOk(text) {
    const box = document.getElementById('responseBox');
    box.className = 'response-box';
    box.textContent = text;
  }

  function setResponseError(msg) {
    const box = document.getElementById('responseBox');
    box.className = 'response-box error';
    box.textContent = 'Error: ' + msg;
  }

  function showError(msg) {
    setResponseError(msg);
  }

  function addHistory(num, text, isError, elapsed, model, version) {
    history.unshift({ num, text, isError, elapsed, model, version, ts: new Date().toLocaleTimeString() });
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">Ninguna respuesta todavía.</div>';
      return;
    }
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="history-item-header">
          <span>#${h.num} — ${h.ts}</span>
          <span>${h.model} (${h.version}) · ${h.elapsed}s</span>
        </div>
        <div class="history-item-body ${h.isError ? 'error' : ''}">${escHtml(h.text)}</div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Send on Ctrl+Enter in textareas
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') sendPrompt();
  });
</script>

</body>
</html>
